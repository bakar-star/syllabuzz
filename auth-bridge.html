<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllabuzz · Google sign-in</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#14152a;--mut:#6a6f8a;--line:#e6e8f2;--ac:#6366f1}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c14;--card:#141624;--tx:#eef0ff;--mut:#9094b3;--line:#232640;--ac:#818cf8}}
*{box-sizing:border-box}
body{font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh;margin:0;background:var(--bg);color:var(--tx);padding:20px}
.box{width:min(100%,380px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 20px 50px -24px #1b1e4b40}
.box svg.logo{width:60px;height:60px;margin-bottom:12px}
h1{margin:0 0 6px;font-size:1.3rem}p{margin:0 0 14px;color:var(--mut)}
.sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--ac);border-right-color:transparent;margin:0 auto 14px;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a.btn,button{display:inline-block;font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 20px;text-decoration:none;cursor:pointer}
.err{color:#ef4444}[hidden]{display:none!important}
</style></head>
<body><div class="box">
<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#g)"/><path d="M24 11c-5.5 0-9 4-9 9.5V27l-2.5 3.5h23L33 27v-6.5C33 15 29.5 11 24 11z" fill="#fff"/><path d="M20.5 34a3.5 3.5 0 007 0z" fill="#fff"/></svg>
<div class="sp" id="sp"></div>
<h1 id="t">Signing you in…</h1>
<p id="m">Opening Google. If a window does not appear, allow pop-ups for this page.</p>
<p><a class="btn" id="back" href="#" hidden>Open Syllabuzz</a><button id="retry" hidden>Try again</button></p>
</div>
<script src="firebase-config.js"></script>
<script type="module">
/* Used only by the Android app: signs in with Google in the real browser (Google blocks
   sign-in inside embedded WebViews) and hands the Google ID token back to the app. */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
let state=q.get('state')||'';
if(state){try{sessionStorage.setItem('sb_state',state)}catch(e){}}else{try{state=sessionStorage.getItem('sb_state')||''}catch(e){}}
const auth=getAuth(initializeApp(window.SB_CONFIG.firebase));
const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
const HELP={
  'auth/unauthorized-domain':'This web address is not authorised in Firebase yet (Authentication > Settings > Authorized domains).',
  'auth/operation-not-allowed':'Google sign-in is switched off in Firebase (Authentication > Sign-in method).',
  'auth/popup-closed-by-user':'The Google window was closed before finishing.',
  'auth/cancelled-popup-request':'The Google window was closed before finishing.'
};
function back(idToken){
  $('t').textContent='Returning to Syllabuzz…';$('m').textContent='If the app does not open by itself, tap the button.';
  const u='syllabuzz://auth?idToken='+encodeURIComponent(idToken)+'&state='+encodeURIComponent(state);
  const a=$('back');a.href=u;a.hidden=false;$('sp').hidden=true;
  location.href=u;
}
function fail(e){
  $('sp').hidden=true;$('t').textContent='Sign-in did not finish';
  $('m').className='err';$('m').textContent=HELP[e&&e.code]||('Something went wrong'+(e&&e.code?' ('+e.code+')':'')+'. You can try again.');
  $('retry').hidden=false;
}
async function run(){
  $('retry').hidden=true;$('sp').hidden=false;$('t').textContent='Signing you in…';$('m').className='';$('m').textContent='Opening Google. If a window does not appear, allow pop-ups for this page.';
  try{
    let r=await getRedirectResult(auth);
    if(!r){
      try{r=await signInWithPopup(auth,provider)}
      catch(e){
        if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){await signInWithRedirect(auth,provider);return}
        throw e;
      }
    }
    const c=GoogleAuthProvider.credentialFromResult(r);
    if(!c||!c.idToken)throw new Error('no token');
    back(c.idToken);
  }catch(e){fail(e)}
}
$('retry').onclick=run;
run();
</script></body></html>
